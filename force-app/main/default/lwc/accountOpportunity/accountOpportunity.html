<!--
    @description   LWC para mostrar las oportunidades relacionadas con una cuenta
                   y permitir la modificación del campo StageName desde la interfaz.
    @author        Tu Nombre
    @date          2025-11-02
-->
<template>
    <lightning-card title="Oportunidades por Cuenta" icon-name="standard:opportunity">
        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Seleccionar Cuenta"
                placeholder="Elige una cuenta"
                value={selectedAccountId}
                options={accountOptions}
                onchange={handleAccountChange}>
            </lightning-combobox>
        </div>

        <template if:true={opportunities}>
            <lightning-datatable
                key-field="Id"
                data={opportunities}
                columns={columns}
                hide-checkbox-column
                onsave={handleSave}
                draft-values={draftValues}>
            </lightning-datatable>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_small">
                {error}
            </div>
        </template>
    </lightning-card>
</template>
